<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gub Dice Roller</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #8a8578;
      --accent: #c0392b;
      --border: #e4dfd3;
      --input: #faf8f3;
      --tray: #ece7da;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      --d4: #f3d9a4;
      --d6: #fffdf8;
      --d8: #bfe0c9;
      --d10: #bcd3ee;
      --d20: #e3c4ea;
      --explode: #ff8f4d;
      --success: #2e8b57;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b19;
        --card: #262522;
        --text: #eeeae0;
        --muted: #9a958a;
        --accent: #e05a4a;
        --border: #3a3834;
        --input: #1f1e1b;
        --tray: #1a1917;
        --shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        --d6: #f3efe4;
        --success: #5cc28a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 28px 24px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Dice pool ---------- */
    .pool {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row select {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .row .times {
      color: var(--muted);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      flex: none;
      font-size: 1.2rem;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
    .icon-btn:disabled { visibility: hidden; }

    .add-btn {
      width: 100%;
      padding: 8px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: var(--muted);
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .add-btn:hover { color: var(--accent); border-color: var(--accent); }
    .add-btn:disabled { display: none; }

    .bonus,
    .setting {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .setting select {
      padding: 9px 6px;
      font-size: 1rem;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .bonus input,
    .setting input {
      width: 64px;
      padding: 9px 4px;
      font-size: 1rem;
      text-align: center;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
    }

    .option input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .formula {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ---------- 3D tray ---------- */
    .tray {
      position: relative;
      height: 340px;
      margin-bottom: 20px;
      overflow: hidden;
      background: var(--tray);
      border-radius: 12px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.12);
      touch-action: none;
    }

    .tray canvas {
      display: block;
      touch-action: none;
    }

    .tray .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* ---------- Result ---------- */
    .total {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 6px;
    }

    .total.success { color: var(--success); }
    .total.fail { color: var(--accent); }

    .status {
      font-size: 0.95rem;
      font-weight: 600;
      min-height: 1.3em;
      margin-bottom: 4px;
    }

    .label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
      min-height: 1.2em;
    }

    .roll-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .roll-btn:hover { opacity: 0.9; }
    .roll-btn:active { transform: scale(0.98); }
    .roll-btn:disabled { opacity: 0.6; cursor: default; }

    .history {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: left;
    }

    .history li {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-top: 1px solid var(--border);
    }

    .history li span:first-child { font-family: ui-monospace, Consolas, monospace; }

    .hint {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <main>
    <h1>Dice Roller</h1>

    <div class="pool" id="pool"></div>
    <button class="add-btn" id="add">+ Add another type of dice</button>
    <div class="bonus">
      <label for="bonus">Flat bonus</label>
      <button class="icon-btn" id="bonus-down" title="Decrease bonus">−</button>
      <input type="number" id="bonus" value="0" min="-99" max="99" step="1">
      <button class="icon-btn" id="bonus-up" title="Increase bonus">+</button>
    </div>
    <label class="option">
      <input type="checkbox" id="explode">
      Reroll and add when a die hits its max
    </label>
    <div class="setting">
      <label for="target">Target</label>
      <input type="number" id="target" placeholder="none" min="1" max="999" step="1">
      <select id="target-mode" aria-label="Target direction">
        <option value="atLeast">or higher</option>
        <option value="atMost">or lower</option>
      </select>
    </div>
    <div class="setting">
      <label for="attempts">Attempts</label>
      <select id="attempts">
        <option value="0">Unlimited</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
    </div>
    <div class="formula" id="formula"></div>

    <div class="tray" id="tray"><div class="loading">Loading 3D dice… (needs an internet connection)</div></div>

    <div class="total" id="total">–</div>
    <div class="status" id="status"></div>
    <div class="label" id="label">Press roll or throw a die</div>

    <button class="roll-btn" id="roll">Roll</button>

    <ul class="history" id="history"></ul>
    <div class="hint">Drag a die gently to move it, flick it hard to throw it. Space or Enter rolls everything.</div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    const DIE_TYPES = [4, 6, 8, 10, 20];
    const MAX_COUNT = 10;
    const MAX_ROWS = 5;
    const HISTORY_SIZE = 8;

    // Physics tuning (world units; a d6 is about 1.1 units wide)
    const GRAVITY = -40;
    const THROW_SPEED = 7;       // release faster than this = throw (random spin)
    const MAX_SPEED = 25;
    const DRAG_LIFT = 0.8;       // how high a picked-up die floats above where it was
    const SAMPLE_WINDOW = 100;   // ms of pointer movement used to measure release speed
    const SETTLE_FRAMES = 20;    // frames all dice must stay still before reading the result
    const MAX_EXPLOSIONS = 10;   // safety cap on rerolls per die

    const poolEl = document.getElementById('pool');
    const addBtn = document.getElementById('add');
    const bonusInput = document.getElementById('bonus');
    const explodeInput = document.getElementById('explode');
    const targetInput = document.getElementById('target');
    const targetModeSel = document.getElementById('target-mode');
    const attemptsSel = document.getElementById('attempts');
    const statusEl = document.getElementById('status');
    const formulaEl = document.getElementById('formula');
    const tray = document.getElementById('tray');
    const totalEl = document.getElementById('total');
    const labelEl = document.getElementById('label');
    const historyEl = document.getElementById('history');
    const rollBtn = document.getElementById('roll');

    // Each entry is one group of identical dice, e.g. { count: 2, sides: 6 }
    let pool = [{ count: 2, sides: 6 }];
    let bonus = 0;
    const history = [];

    // Dice on the table, in pool order:
    // { sides, type, mesh, body, locked, lockedAt, frozen, thrown, rolls }
    // rolls holds the max values already banked by exploding; thrown marks dice that may explode
    let dice = [];
    let pendingResult = false;
    let stillFrames = 0;
    let exploding = false;       // true while max dice are rerolling; the other dice are locked

    const rand = (min, max) => min + Math.random() * (max - min);
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    // " + 3", " − 2" or "" for no bonus
    function bonusText() {
      if (bonus > 0) return ` + ${bonus}`;
      if (bonus < 0) return ` − ${-bonus}`;
      return '';
    }

    // "2d6! + 3" — the ! marks exploding dice
    function formula() {
      const bang = explodeInput.checked ? '!' : '';
      return pool.map(g => `${g.count}d${g.sides}${bang}`).join(' + ') + bonusText();
    }

    explodeInput.addEventListener('change', () => {
      formulaEl.textContent = formula();
    });

    // ---------- Challenge: target and attempts ----------
    let attemptsUsed = 0;
    let seriesOver = false;      // succeeded or out of attempts; the next roll starts a new series

    function target() {
      const t = parseInt(targetInput.value, 10);
      return Number.isFinite(t) ? t : null;
    }

    const maxAttempts = () => Number(attemptsSel.value);   // 0 = unlimited

    function targetText() {
      const t = target();
      return t === null ? '' : `need ${t} or ${targetModeSel.value === 'atLeast' ? 'higher' : 'lower'}`;
    }

    function updateRollButton() {
      const max = maxAttempts();
      if (seriesOver) rollBtn.textContent = 'Start again';
      else if (max) rollBtn.textContent = `Roll — attempt ${attemptsUsed + 1} of ${max}`;
      else rollBtn.textContent = 'Roll';
    }

    function resetSeries() {
      attemptsUsed = 0;
      seriesOver = false;
      totalEl.classList.remove('success', 'fail');
      const max = maxAttempts();
      const parts = [targetText(), max ? `${max} attempt${max > 1 ? 's' : ''}` : ''].filter(Boolean);
      statusEl.textContent = parts.length ? parts.join(' · ').replace(/^./, c => c.toUpperCase()) : '';
      updateRollButton();
    }

    [targetInput, targetModeSel, attemptsSel].forEach(el => el.addEventListener('change', resetSeries));

    // Count one attempt and compare the total with the target; returns a mark for the history
    function scoreAttempt(total) {
      attemptsUsed++;
      const t = target();
      const max = maxAttempts();
      const left = max ? max - attemptsUsed : Infinity;
      const success = t !== null && (targetModeSel.value === 'atLeast' ? total >= t : total <= t);

      totalEl.classList.toggle('success', t !== null && success);
      totalEl.classList.toggle('fail', t !== null && !success);

      let msg;
      if (t === null) msg = max ? `Attempt ${attemptsUsed} of ${max}` : '';
      else if (success) msg = max ? `✓ Success on attempt ${attemptsUsed} of ${max}` : `✓ Success (${targetText()})`;
      else if (left === Infinity) msg = `✗ Missed (${targetText()})`;
      else if (left > 0) msg = `✗ Missed — ${left} attempt${left > 1 ? 's' : ''} left`;
      else msg = '✗ Failed — no attempts left';

      if (max && (success || left <= 0)) {
        seriesOver = true;
        if (t === null) msg += ' — no attempts left';
      }

      statusEl.textContent = msg;
      updateRollButton();
      return t === null ? '' : success ? '✓' : '✗';
    }

    function setBonus(value) {
      bonus = clamp(Math.trunc(Number(value)) || 0, -99, 99);
      bonusInput.value = bonus;
      formulaEl.textContent = formula();
    }

    bonusInput.addEventListener('change', () => setBonus(bonusInput.value));
    document.getElementById('bonus-down').addEventListener('click', () => setBonus(bonus - 1));
    document.getElementById('bonus-up').addEventListener('click', () => setBonus(bonus + 1));

    // ---------- Pool editor ----------
    function renderPool() {
      poolEl.innerHTML = '';
      pool.forEach((group, i) => {
        const row = document.createElement('div');
        row.className = 'row';

        const countSel = document.createElement('select');
        countSel.setAttribute('aria-label', 'Number of dice');
        for (let n = 1; n <= MAX_COUNT; n++) {
          countSel.add(new Option(n, n, false, n === group.count));
        }
        countSel.addEventListener('change', () => {
          group.count = Number(countSel.value);
          refresh();
        });

        const times = document.createElement('span');
        times.className = 'times';
        times.textContent = '×';

        const typeSel = document.createElement('select');
        typeSel.setAttribute('aria-label', 'Type of dice');
        DIE_TYPES.forEach(s => typeSel.add(new Option('d' + s, s, false, s === group.sides)));
        typeSel.addEventListener('change', () => {
          group.sides = Number(typeSel.value);
          refresh();
        });

        const removeBtn = document.createElement('button');
        removeBtn.className = 'icon-btn';
        removeBtn.textContent = '×';
        removeBtn.title = 'Remove';
        removeBtn.disabled = pool.length === 1;
        removeBtn.addEventListener('click', () => {
          pool.splice(i, 1);
          renderPool();
          refresh();
        });

        row.append(countSel, times, typeSel, removeBtn);
        poolEl.appendChild(row);
      });
      addBtn.disabled = pool.length >= MAX_ROWS;
    }

    addBtn.addEventListener('click', () => {
      pool.push({ count: 1, sides: 20 });
      renderPool();
      refresh();
    });

    // ---------- Die shapes ----------
    // Turn a three.js polyhedron into a list of unique vertices and triangle faces
    function fromThree(geo) {
      const pos = geo.attributes.position;
      const verts = [];
      const faces = [];
      const seen = new Map();
      for (let i = 0; i < pos.count; i += 3) {
        const face = [];
        for (let j = 0; j < 3; j++) {
          const v = [pos.getX(i + j), pos.getY(i + j), pos.getZ(i + j)];
          const key = v.map(n => n.toFixed(4)).join(',');
          if (!seen.has(key)) {
            seen.set(key, verts.length);
            verts.push(v);
          }
          face.push(seen.get(key));
        }
        faces.push(face);
      }
      return { verts, faces };
    }

    function cubeShape() {
      const verts = [];
      for (let i = 0; i < 8; i++) verts.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1]);
      const faces = [[0, 2, 6, 4], [1, 5, 7, 3], [0, 4, 5, 1], [2, 3, 7, 6], [0, 1, 3, 2], [4, 6, 7, 5]];
      return { verts, faces };
    }

    // Pentagonal trapezohedron: two poles and a zig-zag ring of 10 vertices.
    // The ring offset makes every kite-shaped face perfectly flat.
    function d10Shape() {
      const c = Math.cos(Math.PI / 5);
      const e = (1 - c) / (1 + c);
      const verts = [];
      for (let i = 0; i < 10; i++) {
        const a = i * Math.PI / 5;
        verts.push([Math.cos(a), i % 2 ? -e : e, Math.sin(a)]);
      }
      verts.push([0, 1, 0], [0, -1, 0]);
      const faces = [];
      for (let k = 0; k < 5; k++) {
        faces.push([10, 2 * k, 2 * k + 1, (2 * k + 2) % 10]);
        faces.push([11, 2 * k + 1, (2 * k + 2) % 10, (2 * k + 3) % 10]);
      }
      return { verts, faces };
    }

    const SHAPES = {
      4:  () => ({ ...fromThree(new THREE.TetrahedronGeometry(1)), scale: 0.85 }),
      6:  () => ({ ...cubeShape(), scale: 0.55 }),
      8:  () => ({ ...fromThree(new THREE.OctahedronGeometry(1)), scale: 0.8 }),
      10: () => ({ ...d10Shape(), scale: 0.75 }),
      20: () => ({ ...fromThree(new THREE.IcosahedronGeometry(1)), scale: 0.85 })
    };

    // Opposite d6 faces add up to 7
    function d6Value(n) {
      const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
      if (ax > ay && ax > az) return n.x > 0 ? 1 : 6;
      if (ay > az) return n.y > 0 ? 2 : 5;
      return n.z > 0 ? 3 : 4;
    }

    // ---------- Face textures ----------
    const TEX = 256;
    const INK = '#2b2b2b';
    const PIP_CELLS = { 1: [5], 2: [3, 7], 3: [3, 5, 7], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };

    // uv (0–1, v up) to canvas pixels (y down)
    const toCanvas = ([u, v]) => [u * TEX, (1 - v) * TEX];

    function faceTexture(sides, face, color) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = TEX;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, TEX, TEX);

      // Darken the face outline so edges read clearly
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      face.uv.forEach((uv, i) => ctx[i ? 'lineTo' : 'moveTo'](...toCanvas(uv)));
      ctx.closePath();
      ctx.stroke();

      const [cx, cy] = toCanvas(face.center);
      ctx.fillStyle = INK;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (sides === 6) {
        PIP_CELLS[face.value].forEach(cell => {
          const col = (cell - 1) % 3 - 1;
          const row = Math.floor((cell - 1) / 3) - 1;
          ctx.beginPath();
          ctx.arc(cx + col * TEX * 0.27, cy + row * TEX * 0.27, TEX * 0.085, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (sides === 4) {
        // A d4 shows each corner's number near that corner; the corner pointing up is the result
        ctx.font = `bold ${TEX * 0.2}px system-ui, sans-serif`;
        face.idx.forEach((vi, j) => {
          const [px, py] = toCanvas(face.uv[j]);
          const dx = px - cx, dy = py - cy;
          ctx.save();
          ctx.translate(cx + dx * 0.55, cy + dy * 0.55);
          ctx.rotate(Math.atan2(dy, dx) + Math.PI / 2);
          ctx.fillText(vi + 1, 0, 0);
          ctx.restore();
        });
      } else {
        const size = TEX * (sides === 8 ? 0.34 : 0.3);
        ctx.font = `bold ${size}px system-ui, sans-serif`;
        ctx.fillText(face.value, cx, cy);
        // Underline 6 and 9 so they can't be confused
        if (face.value === 6 || face.value === 9) {
          const w = ctx.measureText(String(face.value)).width;
          ctx.fillRect(cx - w / 2, cy + size * 0.45, w, size * 0.08);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 4;
      return texture;
    }

    // ---------- Die types (built once, shared by every die of that type) ----------
    const types = {};

    function buildType(sides) {
      if (types[sides]) return types[sides];
      const { verts, faces: rawFaces, scale } = SHAPES[sides]();
      const V = verts.map(v => new THREE.Vector3(...v).multiplyScalar(scale));
      const positions = [];
      const uvs = [];
      const faces = [];
      const geometry = new THREE.BufferGeometry();

      rawFaces.forEach((f, fi) => {
        const idx = f.slice();
        const c = new THREE.Vector3();
        idx.forEach(i => c.add(V[i]));
        c.divideScalar(idx.length);

        // Make every face wind counter-clockwise seen from outside
        const n = new THREE.Vector3()
          .subVectors(V[idx[1]], V[idx[0]])
          .cross(new THREE.Vector3().subVectors(V[idx[2]], V[idx[0]]))
          .normalize();
        if (n.dot(c) < 0) {
          idx.reverse();
          n.negate();
        }

        // Flatten the face into 2D (u points at the middle of its first edge), then fit it in the texture
        const edgeMid = new THREE.Vector3().addVectors(V[idx[0]], V[idx[1]]).multiplyScalar(0.5);
        const u = edgeMid.sub(c).normalize();
        const w = new THREE.Vector3().crossVectors(n, u);
        const pts = idx.map(i => {
          const p = new THREE.Vector3().subVectors(V[i], c);
          return [p.dot(u), p.dot(w)];
        });
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        const range = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
        const midX = (Math.max(...xs) + Math.min(...xs)) / 2;
        const midY = (Math.max(...ys) + Math.min(...ys)) / 2;
        const uv = pts.map(p => [0.5 + (p[0] - midX) / range, 0.5 + (p[1] - midY) / range]);
        const center = [uv.reduce((s, p) => s + p[0], 0) / uv.length, uv.reduce((s, p) => s + p[1], 0) / uv.length];

        const start = positions.length / 3;
        for (let k = 1; k < idx.length - 1; k++) {
          for (const j of [0, k, k + 1]) {
            positions.push(V[idx[j]].x, V[idx[j]].y, V[idx[j]].z);
            uvs.push(...uv[j]);
          }
        }
        geometry.addGroup(start, positions.length / 3 - start, fi);

        faces.push({
          idx,
          uv,
          center,
          value: sides === 6 ? d6Value(n) : fi + 1,
          normal: new CANNON.Vec3(n.x, n.y, n.z)
        });
      });

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.computeVertexNormals();

      const makeMaterials = color => faces.map(face => new THREE.MeshStandardMaterial({
        map: faceTexture(sides, face, color),
        roughness: 0.45,
        metalness: 0
      }));

      const cannonVerts = V.map(v => new CANNON.Vec3(v.x, v.y, v.z));
      const shape = new CANNON.ConvexPolyhedron({ vertices: cannonVerts, faces: faces.map(f => f.idx) });

      return (types[sides] = {
        geometry,
        materials: makeMaterials(css('--d' + sides)),
        explodeMaterials: makeMaterials(css('--explode')),
        shape,
        faces,
        verts: cannonVerts
      });
    }

    // ---------- Scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    tray.innerHTML = '';
    tray.appendChild(renderer.domElement);
    const canvas = renderer.domElement;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(5, 14, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
    scene.add(sun);

    // Invisible floor that only shows shadows, so the tray colour shows through
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.25 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // ---------- Physics world ----------
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, GRAVITY, 0) });
    const diceMat = new CANNON.Material('dice');
    const tableMat = new CANNON.Material('table');
    world.addContactMaterial(new CANNON.ContactMaterial(diceMat, tableMat, { friction: 0.3, restitution: 0.45 }));
    world.addContactMaterial(new CANNON.ContactMaterial(diceMat, diceMat, { friction: 0.2, restitution: 0.5 }));

    function staticPlane(rx, ry) {
      const body = new CANNON.Body({ mass: 0, material: tableMat, shape: new CANNON.Plane() });
      body.quaternion.setFromEuler(rx, ry, 0);
      world.addBody(body);
      return body;
    }

    // CANNON.Plane faces +z; rotate each one so it faces into the tray
    staticPlane(-Math.PI / 2, 0);                  // table
    const walls = {
      left:  staticPlane(0, Math.PI / 2),
      right: staticPlane(0, -Math.PI / 2),
      back:  staticPlane(0, 0),
      front: staticPlane(0, Math.PI)
    };

    // Visible area of the table, updated on resize
    const bounds = { x: 5, back: -4, front: 4 };
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function screenToGround(x, y) {
      raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
      const p = new THREE.Vector3();
      raycaster.ray.intersectPlane(groundPlane, p);
      return p;
    }

    // Fit the camera to the number of dice and put the walls at the edges of the view
    function resize() {
      const w = tray.clientWidth;
      const h = tray.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;

      const n = pool.reduce((s, g) => s + g.count, 0);
      const zoom = n <= 8 ? 1 : n <= 20 ? 1.35 : 1.7;
      camera.position.set(0, 15 * zoom, 7 * zoom);
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();

      const bottomLeft = screenToGround(-1, -1);
      const top = screenToGround(0, 1);
      bounds.x = Math.abs(bottomLeft.x) - 0.1;
      bounds.front = bottomLeft.z - 0.1;
      bounds.back = top.z + 0.1;

      walls.left.position.set(-bounds.x, 0, 0);
      walls.right.position.set(bounds.x, 0, 0);
      walls.back.position.set(0, 0, bounds.back);
      walls.front.position.set(0, 0, bounds.front);
    }

    window.addEventListener('resize', resize);

    // ---------- Dice ----------
    function lock(d) {
      d.body.fixedRotation = true;
      d.body.updateMassProperties();
      d.locked = true;
      d.lockedAt = performance.now();
    }

    function unlock(d) {
      d.body.fixedRotation = false;
      d.body.updateMassProperties();
      d.locked = false;
    }

    // A frozen die stays put while exploding dice bounce around it, so its face can't change.
    // Kinematic with no velocity = an immovable obstacle the solver never pushes.
    function freeze(d) {
      d.body.type = CANNON.Body.KINEMATIC;
      d.body.velocity.setZero();
      d.body.angularVelocity.setZero();
      d.frozen = true;
    }

    function unfreeze(d) {
      if (!d.frozen) return;
      d.body.type = CANNON.Body.DYNAMIC;
      d.body.updateMassProperties();
      d.body.wakeUp();
      d.frozen = false;
    }

    function createDie(sides, x, z) {
      const type = buildType(sides);
      const mesh = new THREE.Mesh(type.geometry, type.materials);
      mesh.castShadow = true;
      scene.add(mesh);

      const body = new CANNON.Body({
        mass: 1,
        shape: type.shape,
        material: diceMat,
        linearDamping: 0.1,
        angularDamping: 0.1
      });
      body.position.set(x, rand(1, 2), z);
      body.quaternion.setFromEuler(rand(0, 6.3), rand(0, 6.3), rand(0, 6.3));
      world.addBody(body);

      const d = { sides, type, mesh, body, locked: false, lockedAt: 0, frozen: false, thrown: false, rolls: [] };
      mesh.userData.die = d;
      return d;
    }

    // Called when the pool changes: drop a fresh set of dice onto the table
    function refresh() {
      formulaEl.textContent = formula();
      dice.forEach(d => {
        scene.remove(d.mesh);
        world.removeBody(d.body);
      });
      drag = null;
      pendingResult = false;
      exploding = false;
      rollBtn.disabled = false;
      resetSeries();
      resize();

      const sidesList = pool.flatMap(g => Array(g.count).fill(g.sides));
      const spacing = 1.7;
      const cols = Math.max(1, Math.floor((2 * bounds.x) / spacing));
      const rows = Math.ceil(sidesList.length / cols);
      dice = sidesList.map((sides, i) => {
        const row = Math.floor(i / cols);
        const col = i % cols;
        const inRow = Math.min(cols, sidesList.length - row * cols);
        const x = (col - (inRow - 1) / 2) * spacing;
        const z = (bounds.back + bounds.front) / 2 + (row - (rows - 1) / 2) * spacing;
        return createDie(sides, x, z);
      });

      totalEl.textContent = '–';
      labelEl.textContent = 'Press roll or throw a die';
    }

    // The face pointing up is the result (for a d4, the corner pointing up)
    function readValue(d) {
      const q = d.body.quaternion;
      let best = -Infinity;
      let value = null;
      if (d.sides === 4) {
        d.type.verts.forEach((v, i) => {
          const y = q.vmult(v).y;
          if (y > best) { best = y; value = i + 1; }
        });
      } else {
        d.type.faces.forEach(f => {
          const y = q.vmult(f.normal).y;
          if (y > best) { best = y; value = f.value; }
        });
      }
      return value;
    }

    function waitForResult() {
      pendingResult = true;
      stillFrames = 0;
      rollBtn.disabled = true;
    }

    // Start a fresh throw: forget banked explosions and mark which dice were thrown
    function newThrow(thrownDice) {
      exploding = false;
      dice.forEach(d => {
        unfreeze(d);
        d.rolls = [];
        d.thrown = thrownDice.includes(d);
        d.mesh.material = d.type.materials;
      });
    }

    // The die leaps into the air with a random spin
    function leap(d) {
      if (d.locked) unlock(d);
      d.body.velocity.set(rand(-4, 4), rand(12, 18), rand(-4, 4));
      d.body.angularVelocity.set(rand(-20, 20), rand(-20, 20), rand(-20, 20));
    }

    // Roll button: every die leaps
    function roll() {
      if (rollBtn.disabled) return;
      if (seriesOver) resetSeries();
      newThrow(dice);
      dice.forEach(leap);
      waitForResult();
    }

    // Everything has stopped: explode thrown dice showing their max, or show the result
    function settle() {
      if (explodeInput.checked) {
        const maxed = dice.filter(d => d.thrown && readValue(d) === d.sides && d.rolls.length < MAX_EXPLOSIONS);
        if (maxed.length) {
          exploding = true;
          dice.forEach(d => {
            if (maxed.includes(d)) {
              // Exploding dice change colour and keep it until the next throw
              d.rolls.push(d.sides);
              d.mesh.material = d.type.explodeMaterials;
              unfreeze(d);
              leap(d);
            } else {
              d.thrown = false;
              freeze(d);
            }
          });
          labelEl.textContent = `Max! Rerolling ${maxed.length} ${maxed.length > 1 ? 'dice' : 'die'}…`;
          waitForResult();
          return;
        }
      }
      showResults();
    }

    // ---------- Dragging ----------
    // drag = { die, y, offX, offZ, target: {x, z}, samples: [{x, z, t}] }
    let drag = null;
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    function setPointer(e) {
      const r = canvas.getBoundingClientRect();
      pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
    }

    function dieUnderPointer() {
      const hits = raycaster.intersectObjects(dice.map(d => d.mesh));
      return hits.length ? hits[0].object.userData.die : null;
    }

    function pointOnDragPlane() {
      const p = new THREE.Vector3();
      return raycaster.ray.intersectPlane(dragPlane, p) ? p : null;
    }

    canvas.addEventListener('pointerdown', e => {
      // No grabbing while exploding dice reroll, so no other die can be rerolled
      if (exploding) return;
      setPointer(e);
      const d = dieUnderPointer();
      if (!d) return;
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);

      // Lock rotation while held so a gentle move never changes the face
      lock(d);
      const y = d.body.position.y + DRAG_LIFT;
      dragPlane.constant = -y;
      const p = pointOnDragPlane() || new THREE.Vector3(d.body.position.x, y, d.body.position.z);
      drag = {
        die: d,
        y,
        offX: d.body.position.x - p.x,
        offZ: d.body.position.z - p.z,
        target: { x: d.body.position.x, z: d.body.position.z },
        samples: [{ x: p.x, z: p.z, t: e.timeStamp }]
      };
      canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener('pointermove', e => {
      setPointer(e);
      if (!drag) {
        canvas.style.cursor = !exploding && dieUnderPointer() ? 'grab' : 'default';
        return;
      }
      const p = pointOnDragPlane();
      if (!p) return;
      const margin = 0.6;
      drag.target.x = clamp(p.x + drag.offX, -bounds.x + margin, bounds.x - margin);
      drag.target.z = clamp(p.z + drag.offZ, bounds.back + margin, bounds.front - margin);
      drag.samples.push({ x: p.x, z: p.z, t: e.timeStamp });
      while (drag.samples.length > 2 && e.timeStamp - drag.samples[0].t > SAMPLE_WINDOW) drag.samples.shift();
    });

    function release(e) {
      if (!drag) return;
      const d = drag.die;

      // Release speed from the last few pointer moves; holding still before letting go means no momentum
      setPointer(e);
      const p = pointOnDragPlane();
      if (p) drag.samples.push({ x: p.x, z: p.z, t: e.timeStamp });
      const recent = drag.samples.filter(s => e.timeStamp - s.t <= SAMPLE_WINDOW);
      let vx = 0;
      let vz = 0;
      if (recent.length >= 2) {
        const first = recent[0];
        const last = recent[recent.length - 1];
        const dt = (last.t - first.t) / 1000;
        if (dt > 0) {
          vx = (last.x - first.x) / dt;
          vz = (last.z - first.z) / dt;
        }
      }
      const speed = Math.hypot(vx, vz);
      drag = null;
      canvas.style.cursor = 'grab';

      if (speed > THROW_SPEED) {
        // Throw: momentum from the mouse, a hop, and a random spin that grows with speed
        const s = Math.min(speed, MAX_SPEED);
        unlock(d);
        d.body.velocity.set(vx / speed * s, 3 + s * 0.3, vz / speed * s);
        const spin = 10 + s * 1.2;
        d.body.angularVelocity.set(rand(-spin, spin), rand(-spin, spin), rand(-spin, spin));
        if (seriesOver) resetSeries();
        newThrow([d]);
        waitForResult();
      } else {
        // Gentle move: slide a little and stay locked until it stops, so the face doesn't change
        d.body.velocity.set(vx, 0, vz);
        d.lockedAt = performance.now();
      }
    }

    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);

    // ---------- Results ----------
    function showResults() {
      // Each die: banked explosions plus its final face, e.g. [6, 6, 3]
      const chains = dice.map(d => [...d.rolls, readValue(d)]);
      const sumOf = list => list.reduce((a, b) => a + b, 0);
      const total = sumOf(chains.map(sumOf)) + bonus;
      totalEl.textContent = total;

      // Subtotal per group, e.g. "2d6: (6+6+3)+5=20 · 1d20: 17"
      let k = 0;
      labelEl.textContent = pool.map(g => {
        const groupChains = chains.slice(k, k += g.count);
        const parts = groupChains.map(c => c.length > 1 ? `(${c.join('+')})` : c[0]);
        const sum = sumOf(groupChains.map(sumOf));
        const detailed = groupChains.length > 1 || groupChains[0].length > 1;
        return `${g.count}d${g.sides}: ` + (detailed ? `${parts.join('+')}=${sum}` : sum);
      }).join(' · ') + (bonus ? ` · bonus ${bonus > 0 ? '+' : '−'}${Math.abs(bonus)}` : '');

      exploding = false;
      dice.forEach(unfreeze);

      const mark = scoreAttempt(total);

      history.unshift({ formula: formula(), total, mark });
      if (history.length > HISTORY_SIZE) history.pop();
      historyEl.innerHTML = history.map(h => `<li><span>${h.formula}</span><span>${h.mark} ${h.total}</span></li>`).join('');

      rollBtn.disabled = false;
    }

    // ---------- Main loop ----------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // The held die chases the pointer, floating above the table
      if (drag) {
        const b = drag.die.body;
        b.velocity.set((drag.target.x - b.position.x) * 20, (drag.y - b.position.y) * 20, (drag.target.z - b.position.z) * 20);
        b.angularVelocity.set(0, 0, 0);
      }

      world.step(1 / 60, dt, 5);

      const now = performance.now();
      dice.forEach(d => {
        d.mesh.position.copy(d.body.position);
        d.mesh.quaternion.copy(d.body.quaternion);
        // A gently placed die gets its rotation back once it has come to rest
        if (d.locked && (!drag || drag.die !== d) && now - d.lockedAt > 300 && d.body.velocity.length() < 0.05) {
          unlock(d);
        }
      });

      if (pendingResult) {
        const still = !drag && dice.every(d => d.body.velocity.length() < 0.08 && d.body.angularVelocity.length() < 0.08);
        stillFrames = still ? stillFrames + 1 : 0;
        if (stillFrames > SETTLE_FRAMES) {
          pendingResult = false;
          settle();
        }
      }

      renderer.render(scene, camera);
    }

    rollBtn.addEventListener('click', roll);
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement.tagName;
      if ((e.code === 'Space' || e.code === 'Enter') && tag !== 'BUTTON' && tag !== 'SELECT' && tag !== 'INPUT') {
        e.preventDefault();
        roll();
      }
    });

    renderPool();
    refresh();
    animate();
  </script>
</body>
</html>
